    <meta name="theme-color" content="#f6f5f1" />
    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem("cash-theme"); } catch (error) {}
        var dark = saved === "dark" || (saved !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#181c19" : "#f6f5f1";
      })();
    </script>
